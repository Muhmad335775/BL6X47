plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

tasks.register('downloadVoskModel') {
    def modelUrl = 'https://alphacephei.com/vosk/models/vosk-model-ar-mgb2-0.4.zip'
    def destFile = file("${projectDir}/src/main/assets/vosk_model.zip")

    outputs.file(destFile)

    doLast {
        destFile.parentFile.mkdirs()
        if (!destFile.exists() || destFile.length() < 50_000_000L) {
            println "Downloading Vosk model from ${modelUrl} ..."
            ant.get(src: modelUrl, dest: destFile, verbose: true, usetimestamp: true)
            println "Downloaded vosk_model.zip, size ${destFile.length()} bytes"
        } else {
            println "vosk_model.zip already present (${destFile.length()} bytes) — skipping download"
        }
    }
}

preBuild.dependsOn downloadVoskModel

android {
    namespace 'com.voicereact.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.voicereact.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }

    aaptOptions {
        noCompress "onnx", "vrm", "wav"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    implementation 'com.google.android.filament:filament-android:1.72.0'
    implementation 'com.google.android.filament:gltfio-android:1.72.0'
    implementation 'com.google.android.filament:filament-utils-android:1.72.0'

    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7'
    implementation 'com.arthenica:smart-exception-java:0.2.1'

    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
}
