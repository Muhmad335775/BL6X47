plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.voicereact.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.voicereact.app"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Real-time VRM/glTF rendering engine (Google Filament) — verified real version
    implementation 'com.google.android.filament:filament-android:1.72.0'
    implementation 'com.google.android.filament:gltfio-android:1.72.0'
    implementation 'com.google.android.filament:filament-utils-android:1.72.0'
}
